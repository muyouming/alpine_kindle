pre-start script
	echo "Log from $(date)" > /mnt/us/alpine.log
	exec >>/mnt/us/alpine.log 2>&1
	echo "# Alpine ::: pre-start script"

	echo "Starting alpine linux"
	mkdir -p /tmp/alpine
	mount -o loop,noatime -t ext3 /mnt/base-us/alpine.ext3 /tmp/alpine
	mount -o bind /dev /tmp/alpine/dev
	mount -o bind /dev/pts /tmp/alpine/dev/pts
	mount -o bind /proc /tmp/alpine/proc
	mount -o bind /sys /tmp/alpine/sys
	mount -o bind /var/run/dbus/ /tmp/alpine/run/dbus/
	mkdir -p /tmp/alpine/mnt/us
	mount -o bind /mnt/us /tmp/alpine/mnt/us
	cp /etc/hosts /tmp/alpine/etc/hosts
	cp /etc/resolv.conf /tmp/alpine/etc/resolv.conf
	chmod a+w /dev/shm
	if [ -e /sys/block/zram0/disksize ] && ! grep -q zram0 /proc/swaps; then
		[ "$(cat /sys/block/zram0/disksize)" = "0" ] && echo 805306368 > /sys/block/zram0/disksize
		mkswap /dev/zram0 >/dev/null 2>&1 && swapon /dev/zram0 2>/dev/null && echo "zram swap enabled"
	fi

	# The Scribe's X server is 8-bit StaticGray. Chromium needs 24-bit, so
	# startgui falls back to Xvfb :1 + framebuffer bridge in that case.
	HOSTINFO="$(DISPLAY=:0 xwininfo -root 2>/dev/null)"
	HOSTDEPTH="$(echo "$HOSTINFO" | awk '/Depth:/{print $2; exit}')"
	HOSTW="$(echo "$HOSTINFO" | awk '/Width:/{print $2; exit}')"
	HOSTH="$(echo "$HOSTINFO" | awk '/Height:/{print $2; exit}')"
	[ -z "$HOSTW" ] && HOSTW=1860
	[ -z "$HOSTH" ] && HOSTH=2480
	echo "host X depth=$HOSTDEPTH size=${HOSTW}x${HOSTH}"
	if [ "$HOSTDEPTH" != "24" ] && [ "$HOSTDEPTH" != "32" ]; then
		TOUCH_NAME="$(DISPLAY=:0 xinput list --name-only 2>/dev/null | grep -iE 'multitouch|touchscreen|pt_mt' | head -1)"
		[ -n "$TOUCH_NAME" ] && DISPLAY=:0 xinput disable "$TOUCH_NAME" 2>/dev/null
		echo "$TOUCH_NAME" > /mnt/us/alpine.touchdev
		DISPLAY=:0 xset s off -dpms 2>/dev/null
	fi
	lipc-set-prop com.lab126.powerd disableScreenOff 1 2>/dev/null
	echo "$HOSTDEPTH ${HOSTW}x${HOSTH}" > /mnt/us/alpine.hostx
end script


script
	exec >>/mnt/us/alpine.log 2>&1
	echo "# Alpine ::: script"

	sleep 1
	stop lab126_gui

	read HOSTDEPTH HOSTSIZE < /mnt/us/alpine.hostx
	su -c "chroot /tmp/alpine /startgui.sh $HOSTDEPTH $HOSTSIZE"

	kill $(pgrep Xephyr) 2>/dev/null || true
	killall Xvfb 2>/dev/null || true
	kill -9 $(lsof -t /var/tmp/alpine/) 2>/dev/null || true
	# Kill anything still chrooted into the image (bridge.py, touch.py, Chromium).
	for p in /proc/[0-9]*; do
		[ "$(readlink "$p/root" 2>/dev/null)" = "/var/tmp/alpine" ] && kill -9 "${p##*/}" 2>/dev/null
	done
	killall Xvfb Xephyr 2>/dev/null || true
	sleep 1
end script


post-stop script
	exec >>/mnt/us/alpine.log 2>&1
	echo "# Alpine ::: post-stop script"

	# Kill anything still chrooted into the image (bridge.py, touch.py, Chromium).
	for p in /proc/[0-9]*; do
		[ "$(readlink "$p/root" 2>/dev/null)" = "/var/tmp/alpine" ] && kill -9 "${p##*/}" 2>/dev/null
	done
	killall Xvfb Xephyr 2>/dev/null || true
	sleep 1

	echo "Unmounting Alpine rootfs"
	LOOPDEV="$(losetup -a | grep "/mnt/base-us/alpine.ext3" | cut -d: -f1)"
	umount /tmp/alpine/run/dbus/
	umount /tmp/alpine/mnt/us
	umount /tmp/alpine/sys
	sleep 1
	umount /tmp/alpine/proc
	umount /tmp/alpine/dev/pts
	umount /tmp/alpine/dev
	# Sync beforehand so umount doesn't fail due to the device being busy still
	sync
	umount /tmp/alpine || true
	# Sometimes it fails still and only works by trying again
	while mount | grep -q "alpine.ext3"
	do
		echo "Alpine is still mounted, trying again shortly.."
		sleep 3
		umount /tmp/alpine || true
	done
	echo "Alpine unmounted"
	echo "Disassociating loop device >>$LOOPDEV<<"
	[ -n "$LOOPDEV" ] && losetup -d $LOOPDEV 2>/dev/null || true
	swapoff /dev/zram0 2>/dev/null || true
	TOUCH_NAME="$(cat /mnt/us/alpine.touchdev 2>/dev/null)"
	[ -n "$TOUCH_NAME" ] && DISPLAY=:0 xinput enable "$TOUCH_NAME" 2>/dev/null
	DISPLAY=:0 xset s on +dpms 2>/dev/null
	lipc-set-prop com.lab126.powerd disableScreenOff 0 2>/dev/null
	echo "All done, starting kindle's gui."

	start lab126_gui
end script
